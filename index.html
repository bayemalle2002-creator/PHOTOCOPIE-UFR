  .app { font-family: 'IBM Plex Sans', sans-serif; color: var(--ink); background: var(--paper);
    background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px;
    padding: 20px; border-radius: 14px; max-width: 780px; margin: 0 auto; box-shadow: 0 10px 34px rgba(6,30,74,0.35); }
  h1, h2, h3 { font-family: 'Space Mono', monospace; margin: 0; }
  .header { display:flex; align-items:center; gap:14px; justify-content:space-between; flex-wrap:wrap; margin-bottom:18px; border-bottom: 3px double var(--blue-deep); padding-bottom:14px; }
  .header-left { display:flex; align-items:center; gap:12px; }
  .header-left img.logo { height:56px; width:auto; display:block; }
  .header h1 { font-size: 21px; letter-spacing: 0.3px; color: var(--blue-deep); }
  .header .sub { font-size: 12px; color: var(--ink-soft); margin-top:4px; }
  .hero { position:relative; border-radius:12px; overflow:hidden; margin-bottom:18px; border:1px solid var(--line);
    background: linear-gradient(120deg, var(--blue-deep), var(--blue)); min-height:110px; display:flex; align-items:center; }
  .hero img { position:absolute; right:-10px; bottom:-14px; height:150px; width:auto; opacity:0.95; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35)); }
  .hero-text { position:relative; z-index:1; color:#fff; padding:16px 130px 16px 18px; }
  .hero-text b { font-family:'Space Mono',monospace; font-size:14px; letter-spacing:0.5px; display:block; margin-bottom:4px; }
  .hero-text span { font-size:12px; opacity:0.9; }
  .tabs { display:flex; gap:0; margin-bottom:18px; border: 2px solid var(--ink); border-radius:10px; overflow:hidden; }
  .tab-btn { flex:1; padding:10px 8px; font-family:'Space Mono', monospace; font-size:12.5px; letter-spacing:0.5px;
    background: var(--paper-deep); color: var(--ink-soft); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .tab-btn.active { background: var(--ink); color: var(--white); }
  .tab-btn:not(:last-child) { border-right: 2px solid var(--ink); }
  .board { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding:14px 16px; margin-bottom:18px; }
  .board-title { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color: var(--ink-soft); margin-bottom:8px; }
  .board-row { display:flex; align-items:baseline; gap:6px; font-size:13.5px; padding:3px 0; }
  .leader { flex:1; border-bottom: 1px dotted var(--line); margin: 0 4px 4px; }
  .board-price { font-family:'Space Mono', monospace; font-weight:700; color: var(--blue-deep); }
  .card { background: var(--white); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .card h3 { font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; color: var(--ink-soft); margin-bottom:4px; font-weight:500; }
  .field input, .field select { width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; font-family:'IBM Plex Sans',sans-serif; font-size:14px; background:var(--white); color:var(--ink); }
  .field input:focus, .field select:focus { outline:2px solid var(--blue); border-color:var(--blue); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .filebtn { display:flex; align-items:center; gap:8px; border:1.5px dashed var(--line); border-radius:8px; padding:12px; cursor:pointer; font-size:13px; color: var(--ink-soft); background:var(--paper); }
  .filebtn.has-file { border-color: var(--green); color: var(--green); border-style:solid; }
  .price-preview { display:flex; justify-content:space-between; align-items:center; background: var(--paper-deep); border-radius:8px; padding:12px 14px; margin:14px 0; font-family:'Space Mono',monospace; }
  .price-preview .amt { font-size:20px; font-weight:700; color: var(--blue-deep); }
  .btn { font-family:'Space Mono', monospace; font-size:13px; letter-spacing:0.5px; border:none; border-radius:8px; padding:11px 16px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .btn-primary { background: var(--ink); color: var(--white); width:100%; justify-content:center; }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-wave { background: var(--blue); color:white; }
  .btn-green { background: var(--green); color:white; }
  .btn-red { background: var(--red); color:white; }
  .btn-ghost { background:transparent; color: var(--ink-soft); border:1px solid var(--line); }
  .error { background:#FBE4DD; border:1px solid var(--red); color: var(--red); padding:9px 12px; border-radius:8px; font-size:13px; margin-bottom:12px; display:flex; gap:8px; align-items:center; }
  .notice { background:#E8F0FC; border:1px solid var(--blue); color: var(--blue-deep); padding:9px 12px; border-radius:8px; font-size:12.5px; margin-bottom:14px; }
  .ticket { background: var(--white); border:1.5px dashed var(--ink); border-radius:10px; padding:16px; margin-bottom:14px; position:relative; }
  .ticket-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .ticket-num { font-family:'Space Mono',monospace; font-weight:700; font-size:14px; }
  .stamp { border:2px solid var(--stamp-color); color: var(--stamp-color); transform: rotate(-3deg); padding:4px 9px; border-radius:5px; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.8px; display:inline-block; white-space:nowrap; }
  .ticket-row { display:flex; align-items:center; gap:6px; font-size:13px; color: var(--ink-soft); margin-bottom:10px; word-break:break-all; }
  .ticket-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; font-size:13px; margin-bottom:10px; }
  .ticket-grid .lbl { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color: var(--ink-soft); }
  .ticket-price { font-family:'Space Mono',monospace; font-size:18px; font-weight:700; color: var(--blue-deep); margin-bottom:8px; }
  .ticket-msg { font-size:12.5px; color: var(--ink-soft); font-style:italic; margin-bottom:10px; }
  .ticket-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .wave-box { background: #E8F0FC; border:1px solid var(--blue); border-radius:8px; padding:12px; margin:10px 0; font-size:13px; }
  .wave-box b { color: var(--blue-deep); }
  .track-row { display:flex; gap:8px; margin-bottom:16px; }
  .track-row input { flex:1; }
  .section-title { font-family:'Space Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color: var(--ink-soft); margin: 20px 0 10px; }
  .empty { text-align:center; color: var(--ink-soft); font-size:13px; padding:20px; }
  .gerant-footer { text-align:center; margin-top:10px; }
  .pin-screen { background: var(--white); border:1px solid var(--line); border-radius:12px; padding:28px 20px; text-align:center; }
  .pin-screen input { text-align:center; letter-spacing:3px; font-family:'Space Mono',monospace; text-transform:uppercase; }
  .pin-screen .lock { font-size:26px; margin-bottom:8px; }
  a.dl { color: var(--blue-deep); text-decoration:underline; font-size:12.5px; }
</style>

const TARIFFS = {
  impression: { nb: 60, nbBulk: 50, couleur: 80, couleurBulk: 70 },
  photocopie: { nb: 25, couleur: 30 }
};
const STORAGE_KEY = 'photocopie_ufr_requests';
const GERANT_CODE = 'UFRSI26';

function calcPrice(service, mode, qty) {
  qty = Math.max(0, parseInt(qty) || 0);
  if (!qty) return 0;
  if (service === 'impression') {
    const bulk = qty > 50;
    const rate = mode === 'couleur'
      ? (bulk ? TARIFFS.impression.couleurBulk : TARIFFS.impression.couleur)
      : (bulk ? TARIFFS.impression.nbBulk : TARIFFS.impression.nb);
    return rate * qty;
  }
  const rate = mode === 'couleur' ? TARIFFS.photocopie.couleur : TARIFFS.photocopie.nb;
  return rate * qty;
}
function ticketNumber(id) { return 'T-' + String(id).slice(-6); }
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' à ' +
    d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
const STATUS_MAP = {
  attente_paiement: { label: 'EN ATTENTE DE PAIEMENT', color: 'var(--amber)', msg: "Réglez votre commande par Wave, puis confirmez le paiement ci-dessous." },
  en_attente_validation: { label: 'PAIEMENT DÉCLARÉ · VALIDATION', color: 'var(--blue)', msg: "Votre paiement Wave est en cours de vérification par le gérant." },
  accepte: { label: 'PAYÉ · EN IMPRESSION', color: 'var(--green)', msg: "Paiement confirmé. Votre document est en cours de traitement." },
  refuse_non_paye: { label: 'PAIEMENT NON REÇU', color: 'var(--red)', msg: "Le paiement n'a pas été retrouvé côté gérant. Merci de vérifier votre transaction Wave et de réessayer." },
  disponible: { label: 'DOCUMENT DISPONIBLE', color: 'var(--green)', msg: "Votre document est prêt ! Passez le récupérer au guichet." }
};

function StatusStamp({ status }) {
  const s = STATUS_MAP[status] || STATUS_MAP.attente_paiement;
  return <span className="stamp" style={{ '--stamp-color': s.color }}>{s.label}</span>;
}
function TariffBoard() {
  const rows = [
    ['Impression N&B (≤ 50 p.)', '60 F / page'],
    ['Impression couleur (≤ 50 p.)', '80 F / page'],
    ['Impression N&B (> 50 p.)', '50 F / page'],
    ['Impression couleur (> 50 p.)', '70 F / page'],
    ['Photocopie N&B', '25 F / page'],
    ['Photocopie couleur', '30 F / page'],
  ];
  return (
    <div className="board">
      <div className="board-title">Tarifs du guichet</div>
      {rows.map(([label, price]) => (
        <div className="board-row" key={label}>
          <span>{label}</span><span className="leader" /><span className="board-price">{price}</span>
        </div>
      ))}
    </div>
  );
}
function Ticket({ req, children }) {
  return (
    <div className="ticket">
      <div className="ticket-top">
        <span className="ticket-num">{ticketNumber(req.id)}</span>
        <StatusStamp status={req.statut} />
      </div>
      <div className="ticket-body">
        <div className="ticket-row">📄 {req.fileName}</div>
        <div className="ticket-grid">
          <div><span className="lbl">Client</span>{req.nom}</div>
          <div><span className="lbl">Téléphone</span>{req.telephone}</div>
          <div><span className="lbl">Service</span>{req.service === 'impression' ? 'Impression' : 'Photocopie'}</div>
          <div><span className="lbl">Mode</span>{req.mode === 'couleur' ? 'Couleur' : 'Noir & blanc'}</div>
          <div><span className="lbl">Copies</span>{req.copies}</div>
          <div><span className="lbl">Déposé le</span>{formatDate(req.date)}</div>
        </div>
        <div className="ticket-price">{req.prix} F CFA</div>
        <div className="ticket-msg">{(STATUS_MAP[req.statut] || STATUS_MAP.attente_paiement).msg}</div>
        {children}
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('etudiant');
  const [requests, setRequests] = useState([]);
  const [error, setError] = useState('');
  const [form, setForm] = useState({ nom: '', telephone: '', service: 'impression', mode: 'nb', copies: '', fileName: '', fileData: '' });
  const [submitting, setSubmitting] = useState(false);
  const [lastTicketId, setLastTicketId] = useState(null);
  const [trackPhone, setTrackPhone] = useState('');
  const [searched, setSearched] = useState(false);
  const [gerantAuth, setGerantAuth] = useState(false);
  const [pinInput, setPinInput] = useState('');
  const [pinError, setPinError] = useState('');

  function handlePinSubmit(e) {
    e.preventDefault();
    if (pinInput.trim().toUpperCase() === GERANT_CODE) {
      setGerantAuth(true); setPinError(''); setPinInput('');
    } else {
      setPinError('Code incorrect.');
    }
  }
  function handleTabClick(next) {
    setTab(next);
  }

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      setRequests(raw ? JSON.parse(raw) : []);
    } catch (e) { setRequests([]); }
  }, []);

  function persist(next) {
    setRequests(next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); }
    catch (e) { setError("La sauvegarde a échoué (stockage plein ou fichier trop volumineux)."); }
  }

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { setError('Le fichier dépasse 4 Mo. Choisissez un fichier plus léger.'); return; }
    setError('');
    const reader = new FileReader();
    reader.onload = () => setForm(f => ({ ...f, fileName: file.name, fileData: reader.result }));
    reader.readAsDataURL(file);
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (!form.nom || !form.telephone || !form.copies || Number(form.copies) <= 0 || !form.fileData) {
      setError('Merci de remplir tous les champs et de charger un document.'); return;
    }
    setSubmitting(true);
    const id = Date.now();
    const prix = calcPrice(form.service, form.mode, form.copies);
    const newReq = {
      id, nom: form.nom, telephone: form.telephone, service: form.service, mode: form.mode,
      copies: parseInt(form.copies), prix, fileName: form.fileName, fileData: form.fileData,
      statut: 'attente_paiement', date: new Date().toISOString()
    };
    persist([newReq, ...requests]);
    setLastTicketId(id);
    setForm({ nom: form.nom, telephone: form.telephone, service: 'impression', mode: 'nb', copies: '', fileName: '', fileData: '' });
    setSubmitting(false);
  }

  const declarePaid = id => persist(requests.map(r => r.id === id ? { ...r, statut: 'en_attente_validation' } : r));
  const confirmPayment = id => persist(requests.map(r => r.id === id ? { ...r, statut: 'accepte' } : r));
  const markUnpaid = id => persist(requests.map(r => r.id === id ? { ...r, statut: 'refuse_non_paye' } : r));
  const markAvailable = id => persist(requests.map(r => r.id === id ? { ...r, statut: 'disponible' } : r));
  const resetAll = () => { if (window.confirm('Supprimer toutes les demandes de démonstration ?')) persist([]); };

  const price = calcPrice(form.service, form.mode, form.copies);
  const lastTicket = requests.find(r => r.id === lastTicketId);
  const myTickets = requests.filter(r => r.telephone.trim() === trackPhone.trim() && trackPhone.trim() !== '');
  const pending = requests.filter(r => r.statut === 'attente_paiement' || r.statut === 'en_attente_validation');
  const active = requests.filter(r => r.statut === 'accepte');
  const done = requests.filter(r => r.statut === 'disponible' || r.statut === 'refuse_non_paye');

  return (
    <div className="app">
      <div className="header">
        <div className="header-left">
          <img className="logo" src={LOGO_B64} alt="Logo UFR Sciences de l'Ingénieur" />
          <div>
            <h1>Photocopie de l'UFR SI</h1>
            <div className="sub">Guichet numérique — impression &amp; photocopie, paiement par Wave</div>
          </div>
        </div>
      </div>
      <div className="hero">
        <div className="hero-text">
          <b>Impression &amp; photocopie</b>
          <span>Noir &amp; blanc et couleur, sur documents PDF ou images</span>
        </div>
        <img src={PRINTER_COLOR_B64} alt="Imprimante multifonction HP" />
      </div>
      <div className="notice">La Photocopie de l'UFR SI a été mise en place dans le but de faciliter l'accès des étudiants aux services d'impression et de photocopie, avec des tarifs abordables.</div>
      <div className="tabs">
        <button className={`tab-btn ${tab === 'etudiant' ? 'active' : ''}`} onClick={() => setTab('etudiant')}>🖨️ Guichet Étudiant</button>
        <button className={`tab-btn ${tab === 'gerant' ? 'active' : ''}`} onClick={() => setTab('gerant')}>📁 Guichet Gérant</button>
      </div>
      {error && <div className="error">⚠️ {error}</div>}

      {tab === 'etudiant' && (
        <div>
          <TariffBoard />
          {lastTicket ? (
            <div className="card">
              <h3>✅ Demande envoyée</h3>
              <Ticket req={lastTicket}>
                {lastTicket.statut === 'attente_paiement' && (
                  <>
                    <div className="wave-box">Envoyez <b>{lastTicket.prix} F CFA</b> sur Wave au numéro du guichet, puis confirmez ci-dessous.</div>
                    <div className="ticket-actions">
                      <button className="btn btn-wave" onClick={() => declarePaid(lastTicket.id)}>💳 J'ai payé sur Wave</button>
                    </div>
                  </>
                )}
              </Ticket>
              <button className="btn btn-ghost" onClick={() => setLastTicketId(null)} style={{ width: '100%', justifyContent: 'center' }}>Déposer une autre demande</button>
            </div>
          ) : (
            <form className="card" onSubmit={handleSubmit}>
              <h3>⬆️ Déposer un document</h3>
              <div className="row2">
                <div className="field"><label>Nom complet</label><input value={form.nom} onChange={e => setForm(f => ({ ...f, nom: e.target.value }))} placeholder="Ex : Fatou Diop" /></div>
                <div className="field"><label>Téléphone (Wave)</label><input value={form.telephone} onChange={e => setForm(f => ({ ...f, telephone: e.target.value }))} placeholder="77 xxx xx xx" /></div>
              </div>
              <div className="row2">
                <div className="field"><label>Service</label>
                  <select value={form.service} onChange={e => setForm(f => ({ ...f, service: e.target.value }))}>
                    <option value="impression">Impression</option><option value="photocopie">Photocopie</option>
                  </select>
                </div>
                <div className="field"><label>Mode</label>
                  <select value={form.mode} onChange={e => setForm(f => ({ ...f, mode: e.target.value }))}>
                    <option value="nb">Noir &amp; blanc</option><option value="couleur">Couleur</option>
                  </select>
                </div>
              </div>
              <div className="field"><label>Nombre de copies</label><input type="number" min="1" value={form.copies} onChange={e => setForm(f => ({ ...f, copies: e.target.value }))} placeholder="Ex : 12" /></div>
              <div className="field"><label>Document</label>
                <label className={`filebtn ${form.fileName ? 'has-file' : ''}`}>
                  {form.fileName ? '✅' : '⬆️'} {form.fileName || 'Choisir un fichier (PDF, image… max 4 Mo)'}
                  <input type="file" onChange={handleFile} style={{ display: 'none' }} />
                </label>
              </div>
              <div className="price-preview"><span>Montant à payer</span><span className="amt">{price} F CFA</span></div>
              <button className="btn btn-primary" type="submit" disabled={submitting}>{submitting ? 'Envoi…' : '➜ Envoyer la demande'}</button>
            </form>
          )}
          <div className="section-title">Suivre une demande</div>
          <div className="track-row">
            <input placeholder="Votre numéro de téléphone" value={trackPhone} onChange={e => setTrackPhone(e.target.value)} />
            <button className="btn btn-ghost" onClick={() => setSearched(true)}>🔍 Voir</button>
          </div>
          {searched && trackPhone && (
            myTickets.length ? myTickets.map(r => (
              <Ticket key={r.id} req={r}>
                {r.statut === 'attente_paiement' && (
                  <div className="ticket-actions"><button className="btn btn-wave" onClick={() => declarePaid(r.id)}>💳 J'ai payé sur Wave</button></div>
                )}
              </Ticket>
            )) : <div className="empty">Aucune demande trouvée pour ce numéro.</div>
          )}
        </div>
      )}

      {tab === 'gerant' && !gerantAuth && (
        <div className="pin-screen">
          <div className="lock">🔒</div>
          <h3 style={{ marginBottom: 6 }}>Espace réservé au gérant</h3>
          <p style={{ color: 'var(--ink-soft)', fontSize: 13, margin: '0 0 16px' }}>Entrez le code d'accès pour continuer.</p>
          <form onSubmit={handlePinSubmit} style={{ maxWidth: 240, margin: '0 auto' }}>
            <div className="field"><input value={pinInput} onChange={e => setPinInput(e.target.value)} placeholder="Code d'accès" /></div>
            {pinError && <div className="error" style={{ justifyContent: 'center' }}>⚠️ {pinError}</div>}
            <button className="btn btn-primary" type="submit">Accéder</button>
          </form>
        </div>
      )}

      {tab === 'gerant' && gerantAuth && (
        <div>
          <div className="section-title">À valider ({pending.length})</div>
          {pending.length === 0 && <div className="empty">Aucune demande en attente.</div>}
          {pending.map(r => (
            <Ticket key={r.id} req={r}>
              <div className="ticket-row"><a className="dl" href={r.fileData} download={r.fileName}>Télécharger le document</a></div>
              <div className="ticket-actions">
                <button className="btn btn-green" onClick={() => confirmPayment(r.id)}>✅ Confirmer le paiement</button>
                <button className="btn btn-red" onClick={() => markUnpaid(r.id)}>✖ Signaler non payé</button>
              </div>
            </Ticket>
          ))}
          <div className="section-title">En impression ({active.length})</div>
          {active.length === 0 && <div className="empty">Rien en cours d'impression.</div>}
          {active.map(r => (
            <Ticket key={r.id} req={r}>
              <div className="ticket-row"><a className="dl" href={r.fileData} download={r.fileName}>Télécharger le document</a></div>
              <div className="ticket-actions"><button className="btn btn-green" onClick={() => markAvailable(r.id)}>✅ Marquer disponible</button></div>
            </Ticket>
          ))}
          <div className="section-title">Historique ({done.length})</div>
          {done.length === 0 && <div className="empty">Aucun dossier clos.</div>}
          {done.map(r => <Ticket key={r.id} req={r} />)}
          <div className="gerant-footer">
            <button className="btn btn-ghost" onClick={resetAll}>🗑️ Vider les données de démonstration</button>
            {' '}
            <button className="btn btn-ghost" onClick={() => { setGerantAuth(false); setTab('etudiant'); }}>🔒 Se déconnecter</button>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
